name: Daily Trajectory Guard

on:
  schedule:
    - cron: '0 2 * * *'  # 2 AM UTC daily
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  trajectory-guard:
    name: Check Trajectory Conformance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Run trajectory-guard
        run: |
          python -m skills.trajectory_guard --strictness ordered --fail-on-drift

      - name: Create drift alert issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## ⚠️ Trajectory Drift Detected
            
            The daily trajectory-guard check found drift between expected and actual skill execution trajectory.
            
            **Expected trajectory** (from \`trajectory.md\`): Strictness: ordered
            **Actual trajectory** (from telemetry): Skills executed in different order or missing steps.
            
            Please review the workflow logs for details and consider:
            1. Running \`intent-collect\` to re-establish trajectory
            2. Checking if skills were skipped or reordered
            3. Verifying HITL gates were not bypassed
            
            *Auto-generated by daily trajectory-guard check*`;
            
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[DRIFT] Trajectory conformance failure - ' + new Date().toISOString().split('T')[0],
              body: body,
              labels: ['trajectory-drift', 'alert', 'automated']
            });