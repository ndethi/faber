name: PM Label Sync

on:
  push:
    branches: [dev]
    paths:
      - '.github/pm-config.yaml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync-labels:
    name: Sync Label Taxonomy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install pyyaml

      - name: Configure gh CLI
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token

      - name: Sync labels (dry-run first)
        id: dryrun
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python skills/pm-github/scripts/cli.py \
            --config .github/pm-config.yaml \
            sync-labels

      - name: Apply label changes
        if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/dev'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python skills/pm-github/scripts/cli.py \
            --config .github/pm-config.yaml \
            sync-labels \
            --apply