github:
  repo: "ndethi/faber"
  dry_run_comment: true

labels:
  taxonomy:
    - name: "bug"
      color: "d73a4a"
      description: "Something isn't working"
    - name: "enhancement"
      color: "a2eeef"
      description: "New feature or request"
    - name: "docs"
      color: "0075ca"
      description: "Documentation improvements"
    - name: "refactor"
      color: "fad8c7"
      description: "Code restructuring"
    - name: "security"
      color: "ff0000"
      description: "Security vulnerability"
    - name: "priority:critical"
      color: "b60205"
      description: "Critical priority"
    - name: "priority:high"
      color: "d93f0b"
      description: "High priority"
    - name: "priority:medium"
      color: "fbca04"
      description: "Medium priority"
    - name: "priority:low"
      color: "0e8a16"
      description: "Low priority"
    - name: "severity:critical"
      color: "b60205"
      description: "Critical severity"
    - name: "severity:high"
      color: "d93f0b"
      description: "High severity"
    - name: "severity:medium"
      color: "fbca04"
      description: "Medium severity"
    - name: "severity:low"
      color: "0e8a16"
      description: "Low severity"
    - name: "target:v0.3.0"
      color: "5319e7"
      description: "Target v0.3.0"
    - name: "target:v0.4.0"
      color: "5319e7"
      description: "Target v0.4.0"

project:
  owner: "ndethi"
  title: "Faber Project Board"
  body: "Auto-generated by pm-github skill"
  fields:
    - name: "Status"
      type: "SINGLE_SELECT"
      options: ["Backlog", "Ready", "In Progress", "In Review", "Done"]
    - name: "Priority"
      type: "SINGLE_SELECT"
      options: ["Critical", "High", "Medium", "Low"]
    - name: "Severity"
      type: "SINGLE_SELECT"
      options: ["Critical", "High", "Medium", "Low"]
    - name: "Type"
      type: "SINGLE_SELECT"
      options: ["Bug", "Enhancement", "Docs", "Refactor", "Security", "Needs Triage"]
    - name: "Target Release"
      type: "TEXT"
      options: []
    - name: "Epic"
      type: "TEXT"
      options: []

paths:
  proposals: "runs/hermes/pm-proposals"

audit:
  enabled: true
  log_file: "runs/hermes/pm-log.jsonl"